
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding supports common text characters -->
    <meta charset="UTF-8">

    <!-- Responsive layout on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title shown in the browser tab -->
    <title>FoodFlow | Fresh Food, Delivered Fast</title>

    <!-- Website design variables -->
    <link rel="stylesheet" href="css/variables.css">

    <!-- Main website stylesheet -->
    <link rel="stylesheet" href="css/main.css">

    <!-- Responsive website stylesheet -->
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- =====================================
         SITE HEADER
         Contains the brand and main navigation
    ====================================== -->
    <header class="site-header">

        <div class="container header-container">

            <!-- Brand identity -->
            <a class="brand" href="index.html" aria-label="FoodFlow home">

                <!-- Temporary text-based logo -->
                <span class="brand-name">
                    Food<span class="brand-highlight">Flow</span>
                </span>

            </a>

            <!-- Main website navigation -->
            <nav class="site-navigation" aria-label="Main navigation">

                <ul class="navigation-list">

                    <li class="navigation-item">
                        <a
                            class="navigation-link is-active"
                            href="index.html"
                            aria-current="page"
                        >
                            Home
                        </a>
                    </li>

                    <li class="navigation-item">
                        <a class="navigation-link" href="pages/menu.html">
                            Menu
                        </a>
                    </li>

                    <li class="navigation-item">
                        <a class="navigation-link" href="pages/deals.html">
                            Deals
                        </a>
                    </li>

                    <li class="navigation-item">
                        <a class="navigation-link" href="pages/about.html">
                            About
                        </a>
                    </li>

                    <li class="navigation-item">
                        <a class="navigation-link" href="pages/contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

            <!-- Customer actions -->
            <div class="header-actions">

                <a
                    class="cart-link"
                    href="pages/cart.html"
                    aria-label="View shopping cart"
                >
                    Cart
                </a>

                <a class="button button-primary" href="pages/login.html">
                    Sign Up
                </a>

            </div>

        </div>

    </header>

    <!-- Main page content will be added in the next step -->
    <main id="main-content">

    </main>

</body>

</html>
