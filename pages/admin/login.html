<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | FoodFlow</title>

  <!-- Remove this line if main.css / your project already imports Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Path is for pages/admin/login.html -->
  <link rel="stylesheet" href="../css/admin.css">
  <!-- <link rel="stylesheet" href="../css/admin-responsive.css"> -->
</head>
<body class="admin-login-body">

  <main class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark" aria-hidden="true">
        <!-- Replace with your logo image if the project has one in assets/images -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 14a4 4 0 0 1-.5-7.9A5 5 0 0 1 15 4.6 4 4 0 0 1 18 14"/>
          <path d="M6 14h12v5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/>
        </svg>
      </span>
      <span class="login-brand-name">FoodFlow <span class="login-brand-role">Admin</span></span>
    </div>

    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Log in to manage your menu and customers.</p>

    <form class="login-form" action="#" method="post">

      <div class="form-group">
        <label for="identifier">Email or username</label>
        <input type="text" id="identifier" name="identifier" placeholder="admin@foodflow.pk" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <!-- Visual only: no JavaScript yet, so this does not toggle anything -->
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember-me">
        <input type="checkbox" name="remember">
        <span>Remember me</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>

    </form>

  </main>

</body>
</html>
